<div class="mx-auto w-full max-w-[1080px] mt-16">
  <section class="ns-current-month">
    <h2 class="font-semibold text-3xl">{{ today | date : "MMMM yyyy"}}</h2>
    <div class="ns-stat-cards flex w-full justify-around gap-4 mt-8">
      <div
        class="ns-stats-card bg-neutral-100 py-4 px-8 rounded-lg text-center"
      >
        <div class="font-medium text-lg">Aktivni oglasi</div>
        <div class="font-bold text-2xl mt-2">{{hisaSum + stanovanjeSum}}</div>
      </div>
      <div
        class="ns-stats-card bg-neutral-100 py-4 px-8 rounded-lg text-center"
      >
        <div class="font-medium text-lg">Stanovanja</div>
        <div class="font-bold text-2xl mt-2">{{stanovanjeSum}}</div>
      </div>
      <div
        class="ns-stats-card bg-neutral-100 py-4 px-8 rounded-lg text-center"
      >
        <div class="font-medium text-lg">Hiše</div>
        <div class="font-bold text-2xl mt-2">{{hisaSum}}</div>
      </div>
    </div>
    <div class="ns-ads-by-region-chart mt-16">
      <div class="bg-neutral-50 rounded-lg p-6">
        <h2 class="text-xl font-semibold ml-7">
          Število aktivnih oglasov po regijah
        </h2>
        <div class="mt-4">
          <app-bar-chart
            [barChartData]="adsByRegion"
            [customChartOptions]="customChartOptions"
          />
        </div>
      </div>
    </div>
  </section>
  @if (median) {
  <div class="mt-[1000px]">
    <app-analytics-median-chart [median]="median" />
  </div>
  }
</div>
