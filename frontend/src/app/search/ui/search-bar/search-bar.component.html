<div>
  <form
    class="flex flex-col items-center"
    [formGroup]="searchForm"
    (ngSubmit)="onSubmit()"
  >
    <div class="mb-4">
      <input
        class="bg-neutral-50 hover:bg-neutral-100 min-w-96 focus-visible:outline-1 focus-visible:outline-neutral-400 rounded-xl border-neutral-900 p-2 text-base"
        id="ad-url"
        type="url"
        name="ad-url"
        placeholder="Prilepi URL oglasa"
        required
        formControlName="url"
      />
    </div>
    <div>
      <button
        type="submit"
        class="bg-sea-blue-200 transition-colors duration-200 hover:bg-sea-blue-100 text-white font-semibold px-6 py-3 rounded-xl"
      >
        Prikaži zgodovino
      </button>
    </div>
  </form>
</div>
