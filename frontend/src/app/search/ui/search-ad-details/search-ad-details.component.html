<div class="xl:max-w-[590px]">
  @if(ad.naslov) {
  <div class="flex flex-col md:flex-row md:items-center gap-1 md:gap-4 mb-5 md:mb-6 pb-2 lg:py-3.5 border-b ">

    <!-- Print isAdActive? -->
    <div class="md:order-last">
      @if(isAdActive(ad.price_data[ad.price_data.length - 1].record_ts)) {
      <span class="bg-green-100 text-green-600 text-sm md:text-base px-2 md:px-3 py-1 md:py-1.5 rounded-lg">
        Aktiven
      </span>
      }@else {
      <span class="bg-red-100 text-red-600 text-sm md:text-base px-2 md:px-3 py-1 md:py-1.5 rounded-lg">
        Neaktiven
      </span>
      }
    </div>

    <h1 class="text-neutral-900 hover:text-neutral-600 font-semibold text-xl md:text-2xl">
      <a href="{{ ad.url }}" target="_blank" class="relative inline-block">
        {{ ad.naslov }}
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6 inline-block relative -top-[3px]">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
        </svg>
      </a>
    </h1>

  </div>
  }

  <div class="ns-ad-details ns-container grid grid-cols-4 md:grid-cols-6 gap-4">
    <app-search-ad-item class="col-span-2" [label]="'Oglas zaznan'" [value]="ad.detected_ts" [format]="'date'" />
    <app-search-ad-item class="col-span-2" [label]="'Zadnja sprememba'" [value]="ad.updated_ts" [format]="'date'" />
    <app-search-ad-item class="md:order-first col-span-2" [label]="'Posredovanje'" [value]="ad.posredovanje" />
    <app-search-ad-item class="col-span-2" [label]="'Regija'" [value]="ad.regija" />
    <app-search-ad-item class="col-span-2" [label]="'Vrsta'" [value]="ad.vrsta" />

    @if(ad.tip) {
    <app-search-ad-item class="col-span-2" [label]="'Tip'" [value]="ad.tip" />

    }

    <app-search-ad-item class="col-span-2" [label]="'Velikost'" [value]="ad.velikost" [format]="'sq-meter'" />

    @if(ad.zemljisce) {
    <app-search-ad-item class="col-span-2" [label]="'Zemljišče'" [value]="ad.zemljisce" [format]="'sq-meter'" />

    } @if(ad.leto_izgradnje) {
    <app-search-ad-item class="col-span-2" [label]="'Leto izgradnje'" [value]="ad.leto_izgradnje" />

    } @if(ad.nadstropje) {
    <app-search-ad-item class="col-span-2" [label]="'Nadstropje'" [value]="ad.nadstropje" />
    }
    @if(ad.agencija){
    <app-search-ad-item class="col-span-4 md:col-span-6" [label]="'Agencija'" [value]="ad.agencija" />
    }
  </div>
</div>
