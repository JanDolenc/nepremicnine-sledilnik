<div
  class="fixed lg:hidden bottom-3 right-3 bg-sea-blue-200 text-neutral-100 p-2 rounded-xl group"
  [class.hidden]="hide"
>
  <button
    (click)="hide = true"
    class="absolute opacity-0 group-hover:opacity-100 transition-opacity delay-[2000ms] duration-200 ease-in -top-2 -right-2 bg-neutral-100 text-neutral-900"
  >
    <span class="sr-only">Hide new search button</span>

    <!-- clear search bar text (x-mark) -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="size-4"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M6 18 18 6M6 6l12 12"
      />
    </svg>
  </button>
  <a routerLink="/search">
    <span class="sr-only">New search</span>
    <!-- search icon (magnifying-glass)-->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="size-7"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
      />
    </svg>
  </a>
</div>
