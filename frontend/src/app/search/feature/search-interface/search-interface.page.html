<div class="flex flex-col items-center gap-36">
  <div class="mt-16 md:mt-24">
    <div class="ns-title text-center mb-8">
      <h1 class="font-semibold text-2xl text-neutral-900">
        Poglej zgodovino za nepremičnino, ki te zanima.
      </h1>
      <span class="font-semibold text-base text-neutral-900 opacity-80"
        >Brskaj. Kopiraj. Prilepi.</span
      >
    </div>
    <app-search-bar
      [options]="{layout: 'vertical', placeholderText: 'Prilepi URL povezavo oglasa',
    miniButton: false,}"
      (searchEvent)="navigateToResultPage($event)"
    />
    <section aria-labelledby="example-listings-title" class="mt-10 text-center">
      <h2 id="example-listings-title" class="font-semibold text-neutral-900">
        Primeri iz arhiva
      </h2>
      <ul class="mt-4 flex flex-col items-center justify-center gap-3 sm:flex-row sm:flex-wrap">
        @for (listing of exampleListings; track listing.url) {
        <li>
          <a
            [routerLink]="['/search/url', listing.url]"
            class="inline-flex items-center gap-2 rounded-lg border border-gray-200 px-4 py-3 text-sm font-medium text-dark-sea hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-dark-sea"
          >
            {{ listing.label }} <span aria-hidden="true">&rarr;</span>
          </a>
        </li>
        }
      </ul>
      <p class="mt-3 text-sm text-neutral-600">
        Oglej si zgodovino cen izbranih nepremičnin. Izvorni oglasi morda niso več
        dostopni.
      </p>
    </section>
  </div>
  <app-search-instructions />
</div>
