@if(ad) {
<div class="flex flex-col lg:flex-row justify-around gap-6 mt-6 md:mt-12">
  <app-search-ad-details class="bg-zinc-50 lg:bg-white p-3 lg:p-0 border lg:border-0 rounded-xl" [ad]="ad" />
  <app-search-ad-price class="bg-zinc-50 lg:bg-white p-3 lg:p-0 border lg:border-0 rounded-xl"
    [price_data]="ad.price_data" />
</div>
@if(similarAds){

<div class="bg-zinc-50 lg:bg-white p-3 lg:p-0 border lg:border-0 rounded-xl mt-6 lg:mt-40 mb-16">
  <app-search-similar-ads [similarAds]="similarAds" (adClickedEvent)="similarAdClicked($event)" />
</div>
} }
