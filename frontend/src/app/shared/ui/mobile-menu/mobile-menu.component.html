<div class="bg-white w-full h-full fixed top-16 left-0 right-0 bottom-0">
  <h3 class="text-2xl font-bold text-neutral-900 ml-4 mt-8 mb-2">Menu</h3>
  <nav>
    <ul>
      <li class="h-16 flex items-center px-4 hover:bg-neutral-100">
        <a
          routerLink="/analytics"
          (click)="mobileMenuService.close()"
          class="flex justify-between items-center w-full"
        >
          <!-- analytics icon (bar-chart)-->
          <div class="flex gap-2 items-center">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-8 text-neutral-900"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"
              />
            </svg>
            <span class="text-base text-neutral-900 font-semibold"
              >Analitika</span
            >
          </div>

          <!-- analytics arrow (chevron-right) -->
          <div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-5 text-neutral-900"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m8.25 4.5 7.5 7.5-7.5 7.5"
              />
            </svg>
          </div>
        </a>
      </li>
      <li class="h-16 flex items-center px-4 hover:bg-neutral-100">
        <a
          routerLink="/search"
          (click)="mobileMenuService.close()"
          class="flex justify-between items-center w-full"
        >
          <!-- search icon (magnifying-glass)-->
          <div class="flex gap-2 items-center">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-8 text-neutral-900"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
              />
            </svg>

            <span class="text-base text-neutral-900 font-semibold"
              >Iskalnik</span
            >
          </div>

          <!-- search arrow (chevron-right) -->
          <div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-5 text-neutral-900"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m8.25 4.5 7.5 7.5-7.5 7.5"
              />
            </svg>
          </div>
        </a>
      </li>
    </ul>
  </nav>
</div>
