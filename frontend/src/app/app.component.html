<div class="flex flex-col min-h-screen">
  <app-header class="mx-auto w-full max-w-[2560px] sticky top-0 z-50" />
  <app-mobile-menu
    [class.hidden]="mobileMenuService.isMobileMenuOpen() === false"
    class="z-40"
  />
  <main
    class="flex-grow px-4 md:px-6 lg:px-8 2xl:px-16 mx-auto w-full max-w-[1800px]"
  >
    <aside
      aria-label="Obvestilo o stanju podatkov"
      class="mx-auto mt-4 w-fit max-w-full rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-center text-sm text-amber-900"
    >
      <p>
        <strong>Obvestilo:</strong> Podatki so zgodovinski. Samodejno zbiranje novih
        podatkov trenutno ne deluje.
      </p>
    </aside>
    <app-search-shortcut />
    <router-outlet />
  </main>
</div>
