services:
  reverse-proxy:
    image: traefik:v3.2
    container_name: "traefik"
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
    networks:
      - reverse_proxy-net
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  database:
    image: ${DATABASE_IMAGE}
    container_name: nsledilnik-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DB_USER1=${DB_USER1}
      - DB_USER1_PASSWORD=${DB_USER1_PASSWORD}
      - DB_USER2=${DB_USER2}
      - DB_USER2_PASSWORD=${DB_USER2_PASSWORD}
    networks:
      - nsledilnik_backend-net
    ports:
      - "${HOST_DB_PORT}:3306"
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  api:
    image: ${API_IMAGE}
    container_name: nsledilnik-api
    environment:
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_NAME=${DATABASE_NAME}
    depends_on:
      - database
      - reverse-proxy
    networks:
      - reverse_proxy-net
      - nsledilnik_backend-net
    #ports:
    #  - "${HOST_API_PORT}:80"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.nepremicninesledilnik.com`)"
      - "traefik.http.routers.api.entrypoints=web"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: nsledilnik-frontend
    depends_on:
      - database
      - api
      - reverse-proxy
    networks:
      - reverse_proxy-net
    # ports:
    #   - "${HOST_FRONTEND_PORT}:80"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`nepremicninesledilnik.com`)"
      - "traefik.http.routers.frontend.entrypoints=web"

networks:
  reverse_proxy-net:
  nsledilnik_backend-net:
    external: true

volumes:
  db-data:
    name: "nsledilnik_db-vol"
    external: true
