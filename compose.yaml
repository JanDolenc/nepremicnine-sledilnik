services:
  reverse-proxy:
    image: ${REVERSE_PROXY_IMAGE}
    container_name: "traefik"
    command:
      # - "--log.level=DEBUG"
      - "--api=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Use the shared network, not a backend-only network on multi-network containers.
      - "--providers.docker.network=${COMPOSE_PROJECT_NAME}_reverse_proxy-net"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${CERT_MAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
    networks:
      - reverse_proxy-net
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - "letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reverse-proxy.rule=Host(`traefik.nepremicninesledilnik.com`)"
      - "traefik.http.routers.reverse-proxy.entrypoints=websecure"
      - "traefik.http.routers.reverse-proxy.tls.certresolver=myresolver"
      - "traefik.http.routers.reverse-proxy.service=api@internal"
      - "traefik.http.routers.reverse-proxy.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_USER_PASSWORD_HASH}"

  database:
    image: ${DATABASE_IMAGE}
    container_name: nsledilnik-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DB_USER1=${DB_USER1}
      - DB_USER1_PASSWORD=${DB_USER1_PASSWORD}
      - DB_USER2=${DB_USER2}
      - DB_USER2_PASSWORD=${DB_USER2_PASSWORD}
    networks:
      - nsledilnik_backend-net
    ports:
      - "${HOST_DB_PORT}:3306"
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  api:
    image: ${API_IMAGE}
    container_name: nsledilnik-api
    environment:
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_NAME=${DATABASE_NAME}
    depends_on:
      - database
      - reverse-proxy
    networks:
      - reverse_proxy-net
      - nsledilnik_backend-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.nepremicninesledilnik.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=80"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: nsledilnik-frontend
    depends_on:
      - database
      - api
      - reverse-proxy
    networks:
      - reverse_proxy-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`nepremicninesledilnik.com`) || Host(`www.nepremicninesledilnik.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  umami:
    image: ${UMAMI_IMAGE}
    container_name: umami
    depends_on:
      reverse-proxy:
        condition: service_started
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${UMAMI_PG_USER}:${UMAMI_PG_PASSWORD}@umami-db:5432/${UMAMI_PG_DATABASE}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      COLLECT_API_ENDPOINT: /api/get
      TRACKER_SCRIPT_NAME: fetch.js
    networks:
      - umami-net
      - reverse_proxy-net
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`stats.nepremicninesledilnik.com`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls.certresolver=myresolver"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    environment:
      POSTGRES_DB: ${UMAMI_PG_DATABASE}
      POSTGRES_USER: ${UMAMI_PG_USER}
      POSTGRES_PASSWORD: ${UMAMI_PG_PASSWORD}
    networks:
      - umami-net
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  umami-net:
  reverse_proxy-net:
    # Preserve Compose's default network name and match Traefik's provider setting.
    name: "${COMPOSE_PROJECT_NAME}_reverse_proxy-net"
  nsledilnik_backend-net:
    external: true

volumes:
  letsencrypt:
  umami-db-data:
  db-data:
    name: "nsledilnik_db-vol"
    external: true
