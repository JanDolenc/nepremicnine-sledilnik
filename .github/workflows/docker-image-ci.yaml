name: Docker images build & push

on:
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: "Image version"
        required: true
env:
  REGISTRY: "registry.digitalocean.com/nsledilnik"
  #IMAGE_NAME: "crawler"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["crawler", "api"]
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3

      - name: Build container image
        #working-directory: ./ matrix.image }}
        run: docker build -f ${{ matrix.image}}/Dockerfile . -t $(echo $REGISTRY)/${{ matrix.image}}:$(echo $GITHUB_SHA | head -c7)

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_CR_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 600

      - name: Remove all old images
        run: if [ ! -z "$(doctl registry repository list | grep "${{matrix.image}}")" ]; then doctl registry repository delete-manifest $(echo $IMAGE_NAME) $(doctl registry repository list-tags ${{matrix.image}} | grep -o "sha.*") --force; else echo "No repository"; fi

      - name: Push image to DigitalOcean Container Registry
        run: docker push $(echo $REGISTRY)/${{matrix.image}}:$(echo $GITHUB_SHA | head -c7)
